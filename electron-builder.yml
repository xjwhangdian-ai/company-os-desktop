appId: com.jushi.company-os-desktop
afterPack: build/mac-adhoc-sign.cjs
productName: Agent工作台
directories:
  buildResources: build
# Agent SDK 的原生 claude 可执行文件必须在 asar 外（归档内无法 spawn，见 runner.resolveClaudeExecutable）
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk/node_modules/**
# 安装包内置 company-os 数据目录模板（设置页「初始化目录」用）
extraResources:
  - from: resources/company-os-template
    to: company-os-template
    # 产品库是公司业务数据，只能登录后从公司数据仓库同步，绝不随安装包分发。
    filter:
      - '**/*'
      - '!销售/产品库/**/*'
  # Windows CI 在打包前下载并缓存的离线运行环境；macOS 构建时目录为空，不增加 dmg 体积。
  - from: resources/windows-deps
    to: windows-deps
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
mac:
  category: public.app-category.business
  target:
    - dmg
win:
  # Windows 团队电脑统一使用 x64。主程序文件名使用 ASCII，避免快捷方式或安全软件
  # 对中文可执行文件名处理不一致；界面及快捷方式仍显示“Agent工作台”。
  executableName: AgentWorkbench
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Agent工作台
  uninstallDisplayName: Agent工作台
  createDesktopShortcut: always
  createStartMenuShortcut: true
  include: build/windows-runtime.nsh
